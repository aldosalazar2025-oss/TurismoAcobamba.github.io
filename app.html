<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar - Turismo Recompensas</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="app.html"><span>🌎</span> Turismo Recompensas</a>
    <a class="avatar-link" href="perfil.html"><img id="userPhoto" src="https://placehold.co/80x80?text=👤" alt="Perfil"><span id="userName">Explorador</span></a>
  </header>

  <main class="container page-space">
    <section class="hero">
      <div>
        <p class="eyebrow">¡HOLA, <span id="helloName">EXPLORADOR</span>!</p>
        <h1>¿Qué lugar quieres<br><span>descubrir hoy?</span></h1>
        <p>Explora destinos, sigue la ruta y desbloquea recompensas.</p>
      </div>
      <div class="hero-badge">🧭</div>
    </section>

    <section class="stats-grid">
      <div class="stat-card"><strong id="xpValue">0</strong><span>⭐ XP</span></div>
      <div class="stat-card"><strong id="destinoCount">0</strong><span>🗺️ Descubiertos</span></div>
      <div class="stat-card"><strong id="badgeCount">0</strong><span>🎖️ Insignias</span></div>
    </section>

    <div class="section-heading">
      <div><p class="eyebrow">CATÁLOGO</p><h2>Destinos turísticos</h2></div>
      <span class="pill">Explora</span>
    </div>
    <section id="destinosGrid" class="destinos-grid"></section>
  </main>

  <nav class="bottom-nav">
    <a class="active" href="app.html"><span>🏠</span>Inicio</a>
    <a href="app.html#destinosGrid"><span>🗺️</span>Explorar</a>
    <a href="logros.html"><span>🏆</span>Logros</a>
    <a href="perfil.html"><span>👤</span>Perfil</a>
  </nav>

  <script type="module" src="js/destinos.js"></script>
  <script type="module" src="js/usuario.js"></script>
</body>
</html>
