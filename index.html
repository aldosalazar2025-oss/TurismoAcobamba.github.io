<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script src="js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#aee9ff">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turismo Acobamba">
  <title>Turismo Acobamba</title><link rel="icon" type="image/png" sizes="32x32" href="img/brand/favicon-32.png"><link rel="apple-touch-icon" href="img/brand/favicon-180.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dark.css">
</head>
<body class="auth-body">
  <button type="button" class="theme-toggle-btn theme-toggle-floating" data-theme-toggle>🌙 Modo oscuro</button>
  <main class="auth-page">
    <section class="auth-card">
      <div class="logo-circle"><img src="img/brand/logo.png" alt="Turismo Acobamba"></div>
      <p class="eyebrow">DESCUBRE • EXPLORA • GANA</p>
      <h1>Turismo<br><span>Acobamba</span></h1>
      <p class="muted">Descubre lugares increíbles y colecciona insignias por tus aventuras.</p>
      <button id="googleLogin" class="google-btn" type="button">
        <span class="google-letter">G</span> Continuar con Google
      </button>
      <p id="authMessage" class="small-message"></p>
      <div class="demo-note">Proyecto realizado por el Instituto M.S.T. — Programa de Estudios de A.P.S.T.I.</div>
    </section>
  </main>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/offline.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
